# Serviço de downloads do YouTube da fita Rebobina (yt-dlp + ffmpeg + deno, sem GPU).
#   Subir:            docker compose -f servicos/ytdlp/docker-compose.yml up -d --build   (da pasta da fita)
#   Parar / religar:  docker stop ytdlp   |   docker start ytdlp
#   Testar:           curl http://127.0.0.1:8899/health
#   YouTube mudou e parou de baixar? Suba a versão do yt-dlp no Dockerfile e rode o "up -d --build" de novo.
#
# Os arquivos ficam no volume só até o K7 copiá-los para o workspace da fita (e são apagados depois).
name: ytdlp
services:
  ytdlp:
    build: .
    image: k7-ytdlp:local
    container_name: ytdlp
    ports:
      - "127.0.0.1:8899:8899"
    environment:
      # Vídeos de uma playlist baixados ao mesmo tempo (1 a 6). Mais que isso, o YouTube passa a bloquear.
      YTDLP_PARALELO: "${YTDLP_PARALELO:-3}"
      # Músicas niveladas ao mesmo tempo. Vazio = automático (núcleos da máquina menos 2); um número força.
      NIVELAR_PARALELO: "${NIVELAR_PARALELO:-}"
      # MP3/WAV saem já nivelados (−14 LUFS) do download. 0 desliga.
      NIVELAR_AO_BAIXAR: "${NIVELAR_AO_BAIXAR:-1}"
      # Volume alvo do nivelamento, em LUFS (-14 = padrão das plataformas de música).
      NIVELAR_LUFS: "${NIVELAR_LUFS:--14}"
    volumes:
      - ytdlp-downloads:/downloads
    restart: unless-stopped

volumes:
  ytdlp-downloads:
